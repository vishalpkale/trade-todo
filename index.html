<!DOCTYPE html>
<html>

<head>
    <title>Daily Trading Discipline</title>
    <meta charset="UTF-8">
    <style>
        body {
            background: #020617;
            color: #e5e7eb;
            font-family: system-ui;
            max-width: 900px;
            margin: auto;
            padding: 20px
        }

        h1 {
            color: #22c55e
        }

        h2 {
            color: #38bdf8;
            margin-top: 20px
        }

        .section {
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            background: #020617
        }

        label {
            display: block;
            margin: 6px
        }

        input[type=checkbox] {
            transform: scale(1.2);
            margin-right: 8px
        }

        textarea {
            width: 100%;
            height: 60px;
            background: #020617;
            color: white;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px
        }

        button {
            background: #22c55e;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer
        }

        .saved {
            color: #22c55e;
            margin-top: 10px
        }
    </style>
</head>

<body>

    <h1>DAILY TRADING DISCIPLINE CHECKLIST</h1>
    <input type="date" id="date">

    <div class="section">
        <h2>⏰ BEFORE 9:15 AM</h2>
        <label><input type="checkbox" data-k="calm"> I am calm</label>
        <label><input type="checkbox" data-k="nopressure"> No financial pressure</label>
        <label><input type="checkbox" data-k="internet"> Internet stable</label>
        <label><input type="checkbox" data-k="chart"> Chart 1-min NIFTY</label>
        <label><input type="checkbox" data-k="vwap"> VWAP added</label>
        <label><input type="checkbox" data-k="journalready"> Journal ready</label>
    </div>

    <div class="section">
        <h2>9:15 – 9:30 DATA COLLECTION</h2>
        <label><input type="checkbox" data-k="noearlytrade"> DO NOT TRADE</label>
        <label><input type="checkbox" data-k="fh"> Marked FirstHigh</label>
        <label><input type="checkbox" data-k="fl"> Marked FirstLow</label>
        <label><input type="checkbox" data-k="rangeok"> FirstRange ≥ 0.25%</label>
    </div>

    <div class="section">
        <h2>BIAS CHECK (VWAP)</h2>
        <label><input type="checkbox" data-k="abvwap"> Price above VWAP (CALL only)</label>
        <label><input type="checkbox" data-k="blvwap"> Price below VWAP (PUT only)</label>
        <label><input type="checkbox" data-k="nearvwap"> Near VWAP – NO TRADE</label>
    </div>

    <div class="section">
        <h2>ENTRY CONDITIONS</h2>
        <label><input type="checkbox" data-k="timeok"> Time 09:30–10:45</label>
        <label><input type="checkbox" data-k="pricevwap"> Price above/below VWAP</label>
        <label><input type="checkbox" data-k="breakfhfl"> Break FirstHigh/Low</label>
        <label><input type="checkbox" data-k="closeconfirm"> Close beyond FH/FL</label>
        <label><input type="checkbox" data-k="strongcandle"> Strong candle</label>
        <label><input type="checkbox" data-k="candlerange"> Candle range &lt;1%</label>
        <label><input type="checkbox" data-k="tradeslt2"> Trades today &lt;2</label>
        <label><input type="checkbox" data-k="dailyloss"> Daily loss &lt;₹800</label>
        <label><input type="checkbox" data-k="noactivetrade"> No active trade</label>
    </div>

    <div class="section">
        <h2>STRIKE & ORDER RULES</h2>
        <label><input type="checkbox" data-k="niftyonly"> Only NIFTY</label>
        <label><input type="checkbox" data-k="weekly"> Weekly expiry</label>
        <label><input type="checkbox" data-k="atm1itm"> ATM or 1-ITM only</label>
        <label><input type="checkbox" data-k="onelot"> 1 lot only</label>
        <label><input type="checkbox" data-k="marketorder"> Market order only</label>
        <label><input type="checkbox" data-k="mis"> MIS only</label>
    </div>

    <div class="section">
        <h2>EXIT RULES</h2>
        <label><input type="checkbox" data-k="tp"> +12% Exit</label>
        <label><input type="checkbox" data-k="sl"> −10% Exit</label>
        <label><input type="checkbox" data-k="timestop"> 15-min Exit</label>
    </div>

    <div class="section">
        <h2>DAILY LIMITS</h2>
        <label><input type="checkbox" data-k="max2"> Max 2 trades</label>
        <label><input type="checkbox" data-k="maxloss"> Max loss ₹800</label>
        <label><input type="checkbox" data-k="nosamereentry"> No same-side re-entry</label>
        <label><input type="checkbox" data-k="limitstop"> Stop after limit hit</label>
    </div>

    <div class="section">
        <h2>AFTER MARKET JOURNAL</h2>
        <label><input type="checkbox" data-k="fhflnoted"> FH / FL / VWAP noted</label>
        <label><input type="checkbox" data-k="tradestaken"> Trades recorded</label>
        <label><input type="checkbox" data-k="pnlwritten"> PnL written</label>
        <label><input type="checkbox" data-k="rulesfollowed"> Rules followed</label>
        <label><input type="checkbox" data-k="mistakenoted"> One mistake noted</label>
        <textarea id="notes" placeholder="Mistake / Notes"></textarea>
    </div>

    <div class="section">
        <h2>NIGHT REVIEW</h2>
        <label><input type="checkbox" data-k="broke"> Did NOT break rules</label>
        <label><input type="checkbox" data-k="chase"> Did NOT chase</label>
        <label><input type="checkbox" data-k="boredom"> Did NOT trade boredom</label>
        <label><input type="checkbox" data-k="lossaccept"> Accepted loss cleanly</label>
        <label><input type="checkbox" data-k="stopwhen"> Stopped when rules said stop</label>
    </div>

    <button onclick="saveDay()">Save Today</button>
    <div id="status" class="saved"></div>

    <script>
        const d = document.getElementById("date");
        d.valueAsDate = new Date();

        function saveDay() {
            const key = "day-" + d.value;
            const data = { notes: notes.value };
            document.querySelectorAll("input[type=checkbox]").forEach(c => data[c.dataset.k] = c.checked);
            localStorage.setItem(key, JSON.stringify(data));
            status.innerText = "Saved for " + d.value;
        }

        d.addEventListener("change", () => {
            const data = JSON.parse(localStorage.getItem("day-" + d.value) || "{}");
            document.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = data[c.dataset.k] || false);
            notes.value = data.notes || "";
        });
    </script>

</body>

</html>
